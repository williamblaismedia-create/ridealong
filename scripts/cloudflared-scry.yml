# Scry — extrait d'ingress pour le tunnel Cloudflare PARTAGE de w-agent.
#
# Ceci n'est PAS un config.yml autonome : c'est un extrait a coller dans
# le fichier existant ~/.cloudflared/config.yml, dans SA liste "ingress:",
# AVANT la regle catch-all 404 finale. Les regles d'ingress de cloudflared
# sont evaluees dans l'ordre et la premiere qui correspond gagne — une
# regle placee apres le 404 ne serait donc jamais atteinte.
#
# L'hostname ci-dessous est un EXEMPLE. William choisit le sous-domaine
# reel sur le domaine qu'il utilise deja pour ses tunnels w-agent (le
# meme tunnel qui sert deja marketis et les autres services) — remplacer
# "scry.wautomatisations.com" par ce choix avant de coller.
#
# --- Ajouter dans ~/.cloudflared/config.yml, dans la liste "ingress:", AVANT la regle 404 finale ---
  - hostname: scry.wautomatisations.com
    service: http://127.0.0.1:9400
# Recharger SANS couper les autres tunnels :  systemctl --user reload cloudflared   (ou kill -HUP)
# NE PAS faire  systemctl restart cloudflared  (couperait marketis et les autres).
