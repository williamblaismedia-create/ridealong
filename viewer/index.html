<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Scry — vue live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Jetons W Automatisations (source : W DASHBOARD/design-system/tokens.css).
     Le viewer est une surface inverse : canevas noir chaud, encre creme,
     terracotta reserve a l'action. */
  :root {
    --terra-400: #DF8B68; --terra-500: #DA7756; --terra-600: #C8603D; --terra-700: #A94B2D;
    --warm-25: #FAF8F5; --warm-200: #DDD6CB; --warm-400: #A69C8D; --warm-500: #82796C;
    --warm-700: #463F38; --warm-800: #2A2622; --warm-900: #1A1714; --warm-950: #0E0C0A;
    --green-500: #3E7D5A; --amber-500: #C5882A;
    --border-inverse: rgba(255, 255, 255, 0.14);
    --font-sans: "Montserrat", "Helvetica Neue", Arial, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --r-md: 14px; --r-pill: 999px;
    --shadow-md: 0 10px 26px rgba(0, 0, 0, 0.35), 0 2px 6px rgba(0, 0, 0, 0.25);
    --shadow-terra-sm: 0 6px 16px rgba(218, 119, 86, 0.30);
    --ring-focus-inverse: 0 0 0 3px rgba(218, 119, 86, 0.55);
    --ease-out: cubic-bezier(0.16, 1, 0.30, 1);
    --ease-spring: cubic-bezier(0.34, 1.4, 0.50, 1);
    --dur-fast: 150ms; --dur: 240ms;
    --lift: translateY(-2px); --lift-press: translateY(0) scale(0.985);
    --bar: 56px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--warm-950); color: var(--warm-25);
    font: 500 14px/1.4 var(--font-sans); -webkit-font-smoothing: antialiased; }

  /* Barre : etiquette mono a gauche, action en pilule a droite. */
  #bar { display: flex; align-items: center; gap: 12px; min-height: var(--bar); padding: 8px 16px;
    background: var(--warm-900); border-bottom: 1px solid var(--border-inverse); position: sticky; top: 0; z-index: 2; }
  #brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warm-500); flex: 0 0 auto;
    transition: background var(--dur) var(--ease-out), box-shadow var(--dur) var(--ease-out); }
  #dot.on { background: var(--green-500); box-shadow: 0 0 0 4px rgba(62, 125, 90, 0.22); }
  #eyebrow { font: 500 11px/1 var(--font-mono); letter-spacing: 0.2em; text-transform: uppercase; color: var(--warm-400); white-space: nowrap; }
  #mode { font: 600 13px/1 var(--font-sans); letter-spacing: -0.015em; white-space: nowrap;
    padding: 6px 10px; border-radius: var(--r-pill); border: 1px solid var(--border-inverse); color: var(--warm-200);
    transition: color var(--dur) var(--ease-out), border-color var(--dur) var(--ease-out), background var(--dur) var(--ease-out); }
  #mode.input { color: var(--warm-25); border-color: var(--terra-500); background: rgba(218, 119, 86, 0.16); }
  #hint { color: var(--warm-400); font-size: 13px; margin-left: auto; text-align: right; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* L'action : pilule terracotta pleine pour prendre le controle, contour
     pour le rendre. 44px de haut minimum pour le pouce. */
  #toggle { flex: 0 0 auto; font: 600 14px/1 var(--font-sans); letter-spacing: -0.01em; min-height: 40px; padding: 0 18px;
    border-radius: var(--r-pill); border: 1px solid var(--terra-500); background: var(--terra-500); color: #fff; cursor: pointer;
    touch-action: manipulation; box-shadow: var(--shadow-terra-sm);
    transition: transform var(--dur-fast) var(--ease-spring), background var(--dur) var(--ease-out), box-shadow var(--dur) var(--ease-out), opacity var(--dur) var(--ease-out); }
  #toggle:hover { background: var(--terra-600); transform: var(--lift); }
  #toggle:active { transform: var(--lift-press); }
  #toggle:focus-visible { outline: none; box-shadow: var(--ring-focus-inverse); }
  #toggle:disabled { opacity: 0.45; cursor: default; transform: none; box-shadow: none; }
  #toggle.input { background: transparent; color: var(--warm-25); border-color: var(--border-inverse); box-shadow: none; }
  #toggle.input:hover { border-color: var(--warm-400); background: rgba(255, 255, 255, 0.05); }

  /* Scene : l'ecran distant, coins doux, ombre chaude ; liseret terracotta
     quand William a le controle. */
  #stage { display: flex; justify-content: center; align-items: flex-start; padding: 12px 16px 16px; height: calc(100% - var(--bar)); }
  #screen { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; background: var(--warm-900);
    border-radius: var(--r-md); box-shadow: var(--shadow-md); outline: 2px solid transparent; outline-offset: 3px;
    touch-action: none; -webkit-user-select: none; user-select: none;
    transition: outline-color var(--dur) var(--ease-out), opacity var(--dur) var(--ease-out); }
  body.input #screen { outline-color: var(--terra-500); cursor: crosshair; }
  body.off #screen { opacity: 0.55; }
  #kb { position: absolute; opacity: 0; width: 1px; height: 1px; border: 0; padding: 0; }

  @media (max-width: 520px) {
    #eyebrow { display: none; }
    #hint { display: none; }
    #bar { gap: 8px; padding: 8px 12px; }
    #mode { font-size: 12px; padding: 6px 9px; margin-right: auto; }
    #toggle { font-size: 13px; padding: 0 14px; }
    #stage { padding: 8px; }
  }
</style>
</head>
<body>
  <div id="bar">
    <div id="brand">
      <span id="dot"></span>
      <span id="eyebrow">Scry · vue live</span>
    </div>
    <span id="mode" class="read">…</span>
    <span id="hint"></span>
    <button id="toggle" type="button" disabled>Prendre le contrôle</button>
    <input id="kb" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="capture clavier">
  </div>
  <div id="stage"><img id="screen" alt="vue live"></div>
<script>
(function () {
  // Token from the fragment only (never the query string), then scrub it from
  // history immediately (n4). Never logged. It is ALSO kept in this tab's
  // sessionStorage: a plain reload (the reflex when a view looks stuck) would
  // otherwise come back with no token and lock a valid link out as
  // "lien expire". sessionStorage is per tab, dies with the tab, never
  // reaches history or any server log.
  var KEY = 'scry.token';
  var token = new URLSearchParams((location.hash || '').replace(/^#/, '')).get('token') || '';
  try {
    if (token) sessionStorage.setItem(KEY, token);
    else token = sessionStorage.getItem(KEY) || '';
  } catch (e) {}
  try { history.replaceState(null, document.title, location.pathname + location.search); } catch (e) {}

  var img = document.getElementById('screen');
  var modeEl = document.getElementById('mode');
  var dot = document.getElementById('dot');
  var hint = document.getElementById('hint');
  var kb = document.getElementById('kb');
  var toggle = document.getElementById('toggle');
  var frameW = 0, frameH = 0, mode = 'read';

  // Physical pixels this device can show for the frame (stage size x DPR):
  // the server caps the screencast to exactly that, so a retina desktop
  // gets full-resolution frames and a phone gets a stream its size.
  var bar = document.getElementById('bar');
  function viewSize() {
    var dpr = window.devicePixelRatio || 1;
    var barH = bar.offsetHeight || 41;
    document.documentElement.style.setProperty('--bar', barH + 'px');
    var w = Math.max(1, window.innerWidth - 16), h = Math.max(1, window.innerHeight - barH - 16);
    return { w: Math.round(w * dpr), h: Math.round(h * dpr) };
  }
  var vs = viewSize();

  var scheme = location.protocol === 'https:' ? 'wss://' : 'ws://';
  var ws = null, retryTimer = 0, retryMs = 1000, gaveUp = false;

  // The link drops for ordinary reasons — the phone locks, Safari goes to
  // the background, the tunnel hiccups, the MCP server restarts. The token
  // stays valid through all of that, so reconnect on our own with a short
  // backoff, keeping the last frame on screen. Only an invalid/expired token
  // (close 1008) is final: William needs a fresh link from live_start.
  function connect() {
    clearTimeout(retryTimer);
    if (gaveUp) return;
    if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
    var s = new WebSocket(scheme + location.host + '/?token=' + encodeURIComponent(token) + '&w=' + vs.w + '&h=' + vs.h);
    ws = s;
    s.onopen = function () { retryMs = 1000; dot.classList.add('on'); document.body.classList.remove('off'); toggle.disabled = false; setMode(mode); };
    s.onerror = function () { /* no payload logged */ };
    s.onclose = function (ev) {
      dot.classList.remove('on');
      document.body.classList.add('off');
      toggle.disabled = true;
      if (ev && ev.code === 1008) { gaveUp = true; try { sessionStorage.removeItem(KEY); } catch (e) {} modeEl.textContent = 'Lien expiré'; hint.textContent = 'demande un nouveau lien à Claude'; return; }
      hint.textContent = 'reconnexion…'; modeEl.textContent = 'Hors ligne';
      retryTimer = setTimeout(connect, retryMs);
      retryMs = Math.min(10000, retryMs * 2);
    };
    s.onmessage = function (ev) {
      var msg; try { msg = JSON.parse(typeof ev.data === 'string' ? ev.data : ''); } catch (e) { return; }
      if (!msg) return;
      if (typeof msg.mode === 'string' && msg.mode !== mode) setMode(msg.mode);
      if (typeof msg.data === 'string') {
        if (msg.w) frameW = msg.w;
        if (msg.h) frameH = msg.h;
        img.src = 'data:image/jpeg;base64,' + msg.data;
      }
    };
  }
  connect();
  // Back to the foreground (screen unlock, app switch): don't wait for the
  // backoff, try right away.
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { retryMs = 1000; connect(); } });
  window.addEventListener('online', function () { retryMs = 1000; connect(); });

  // Rotation / window resize: ask for a new cap (debounced; server coalesces).
  var resizeTimer = 0;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      var s = viewSize();
      if (s.w !== vs.w || s.h !== vs.h) { vs = s; send({ t: 'view', w: s.w, h: s.h }); }
    }, 300);
  });

  function setMode(m) {
    mode = m;
    modeEl.textContent = m === 'input' ? 'Vous avez le contrôle' : 'Claude pilote';
    modeEl.className = m;
    document.body.classList.toggle('input', m === 'input');
    hint.textContent = m === 'input' ? 'vos clics et frappes vont au navigateur' : 'lecture seule';
    toggle.textContent = m === 'input' ? 'Rendre le contrôle' : 'Prendre le contrôle';
    toggle.className = m;
  }
  setMode('read');

  // Take / give back control from the page itself (the same switch as the
  // live_mode tool). Enabled only while connected; the server confirms the
  // new mode with a {mode} push, which is what actually flips the UI.
  toggle.addEventListener('click', function () {
    send({ t: 'mode', mode: mode === 'input' ? 'read' : 'input' });
    if (mode !== 'input') { try { kb.focus(); } catch (x) {} }
  });

  function send(obj) { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj)); }

  // Map a client point over the <img> to the page CSS-pixel space CDP uses.
  function toPage(cx, cy) {
    var r = img.getBoundingClientRect();
    if (!r.width || !r.height || !frameW || !frameH) return null;
    return { x: Math.round((cx - r.left) / r.width * frameW), y: Math.round((cy - r.top) / r.height * frameH) };
  }
  function mods(e) { return (e.altKey ? 1 : 0) | (e.ctrlKey ? 2 : 0) | (e.metaKey ? 4 : 0) | (e.shiftKey ? 8 : 0); }

  // Pointer events unify mouse + touch + pen (iOS Safari supports them), so one
  // set of handlers covers the iPhone. Relayed only in input mode.
  function mouse(type, e) {
    if (mode !== 'input') return;
    var p = toPage(e.clientX, e.clientY);
    if (p) send({ t: 'mouse', type: type, x: p.x, y: p.y, button: 'left', clickCount: 1, modifiers: mods(e) });
  }
  img.addEventListener('pointerdown', function (e) { e.preventDefault(); mouse('mousePressed', e); });
  img.addEventListener('pointerup', function (e) { e.preventDefault(); mouse('mouseReleased', e); if (mode === 'input') { try { kb.focus(); } catch (x) {} } });
  img.addEventListener('pointermove', function (e) { if (mode === 'input') { e.preventDefault(); mouse('mouseMoved', e); } });

  // Keyboard, captured at window level (covers a physical keyboard and the
  // hidden #kb input that only exists to raise the mobile soft keyboard).
  // A printable key carries its char as text on keyDown — that is what
  // inserts it (the same shape Puppeteer uses); modifiers with ctrl/meta are
  // treated as shortcuts (no text). keyUp mirrors it. Nothing is buffered.
  window.addEventListener('keydown', function (e) {
    if (mode !== 'input') return;
    // A printable key carries its char as text; Enter carries a carriage
    // return so the keyDown actually submits the login form (without text,
    // CDP's Enter does nothing). Shortcuts (ctrl/meta) carry no text.
    var text = (e.key && e.key.length === 1 && !e.ctrlKey && !e.metaKey) ? e.key
             : (e.key === 'Enter' && !e.ctrlKey && !e.metaKey) ? '\r'
             : undefined;
    send({ t: 'key', type: 'keyDown', key: e.key, code: e.code, windowsVirtualKeyCode: e.keyCode, text: text, modifiers: mods(e) });
    if (e.key !== 'F5') e.preventDefault();
  });
  window.addEventListener('keyup', function (e) {
    if (mode !== 'input') return;
    send({ t: 'key', type: 'keyUp', key: e.key, code: e.code, windowsVirtualKeyCode: e.keyCode, modifiers: mods(e) });
    e.preventDefault();
  });
})();
</script>
</body>
</html>
