<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Scry — vue live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,700;1,800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Jetons W Automatisations (source : W DASHBOARD/design-system/tokens.css).
     Le viewer est une surface inverse : canevas noir chaud, encre creme,
     terracotta reserve a l'action. */
  :root {
    --terra-400: #DF8B68; --terra-500: #DA7756; --terra-600: #C8603D; --terra-700: #A94B2D;
    --warm-25: #FAF8F5; --warm-200: #DDD6CB; --warm-400: #A69C8D; --warm-500: #82796C;
    --warm-600: #605850; --warm-700: #463F38; --warm-800: #2A2622; --warm-900: #1A1714; --warm-950: #0E0C0A;
    --green-500: #3E7D5A; --amber-500: #C5882A;
    --border-inverse: rgba(255, 255, 255, 0.14);
    --font-sans: "Montserrat", "Helvetica Neue", Arial, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --r-md: 14px; --r-pill: 999px;
    --shadow-md: 0 10px 26px rgba(0, 0, 0, 0.35), 0 2px 6px rgba(0, 0, 0, 0.25);
    --shadow-terra-sm: 0 6px 16px rgba(218, 119, 86, 0.30);
    --ring-focus-inverse: 0 0 0 3px rgba(218, 119, 86, 0.55);
    --ease-out: cubic-bezier(0.16, 1, 0.30, 1);
    --ease-spring: cubic-bezier(0.34, 1.4, 0.50, 1);
    --dur-fast: 150ms; --dur: 240ms;
    --lift: translateY(-2px); --lift-press: translateY(0) scale(0.985);
    --bar: 56px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; color: var(--warm-25);
    font: 500 14px/1.4 var(--font-sans); -webkit-font-smoothing: antialiased; }
  /* Fond epure : noir chaud, une lueur terracotta a peine visible sous le
     notch, un leger fondu vers le bas. */
  body { background:
      radial-gradient(56% 34% at 50% 0%, rgba(218, 119, 86, 0.13) 0%, rgba(218, 119, 86, 0) 72%),
      linear-gradient(180deg, #14110E 0%, var(--warm-950) 60%, #0B0908 100%);
    background-attachment: fixed; }

  /* Barre : etiquette mono a gauche, action en pilule a droite. */
  /* Le notch : une capsule accrochee au bord superieur, coins arrondis vers
     le bas, flottante au-dessus de l'ecran. Point | SCRY | toggle. */
  #bar { position: fixed; top: 0; left: 50%; transform: translateX(-50%); z-index: 2; width: max-content; max-width: calc(100vw - 16px);
    display: grid; grid-template-columns: auto auto auto; align-items: center; gap: 18px;
    min-height: var(--bar); padding: 10px 14px 12px 20px;
    background: rgba(26, 23, 20, 0.92); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border: 1px solid var(--border-inverse); border-top: 0; border-radius: 0 0 26px 26px;
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45), inset 0 -1px 0 rgba(255, 255, 255, 0.04); }
  #left, #right { display: flex; align-items: center; gap: 10px; min-width: 0; }
  #right { justify-content: flex-end; }
  /* Etat sous le notch : reconnexion, lien expire. Vide sinon. */
  #hint { position: fixed; top: calc(var(--bar) + 10px); left: 0; right: 0; z-index: 2; text-align: center; pointer-events: none;
    font: 500 11px/1 var(--font-mono); letter-spacing: 0.18em; text-transform: uppercase; color: var(--warm-400);
    transition: opacity var(--dur) var(--ease-out); }
  #hint:empty { opacity: 0; }

  /* Le mot-symbole : SCRY, capitales italiques serrees, creme sur noir chaud. */
  #wordmark { font: italic 800 20px/1 var(--font-sans); letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--warm-25); text-align: center; padding: 0; user-select: none; -webkit-user-select: none; }
  /* La marque : un orbe. Anneau creme, reflet, pupille terracotta. La
     pupille est l'indicateur live : eteinte hors ligne, un leger battement
     par image recue. */
  #mark { display: block; flex: 0 0 auto; overflow: visible; }
  #mark .ring { fill: none; stroke: var(--warm-25); stroke-width: 1.9; opacity: 0.92;
    transition: opacity var(--dur) var(--ease-out); }
  #mark .sheen { fill: none; stroke: var(--warm-25); stroke-width: 1.4; stroke-linecap: round; opacity: 0.45; }
  #dot { fill: var(--warm-700); transform-box: fill-box; transform-origin: center;
    transition: fill var(--dur) var(--ease-out), transform var(--dur-fast) var(--ease-out), filter var(--dur-fast) var(--ease-out); }
  #dot.on { fill: var(--terra-500); }
  #dot.on.blip { transform: scale(1.28); filter: drop-shadow(0 0 4px rgba(218, 119, 86, 0.9)); }
  body.off #mark .ring { opacity: 0.45; }
  @media (prefers-reduced-motion: reduce) { #dot.on.blip { transform: none; } }

  /* Le toggle : deux segments dans une piste, un curseur qui glisse.
     Auto = Claude pilote (creme). Manuel = William a le controle (terracotta). */
  #mode { position: relative; display: grid; grid-template-columns: 1fr 1fr; align-items: stretch; flex: 0 0 auto;
    min-height: 40px; padding: 3px; border-radius: var(--r-pill); background: var(--warm-800); border: 1px solid var(--border-inverse);
    user-select: none; -webkit-user-select: none; }
  #mode::before { content: ""; position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); border-radius: var(--r-pill);
    background: var(--warm-25); box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
    transition: transform var(--dur) var(--ease-spring), background var(--dur) var(--ease-out), box-shadow var(--dur) var(--ease-out); }
  #mode.input::before { transform: translateX(100%); background: var(--terra-500); box-shadow: var(--shadow-terra-sm); }
  #mode button { position: relative; z-index: 1; font: 600 13px/1 var(--font-sans); letter-spacing: -0.01em; min-width: 88px; padding: 0 16px;
    border: 0; border-radius: var(--r-pill); background: transparent; color: var(--warm-400); cursor: pointer; touch-action: manipulation;
    transition: color var(--dur) var(--ease-out); }
  #mode button:focus-visible { outline: none; box-shadow: var(--ring-focus-inverse); }
  #mode.read #seg-auto { color: var(--warm-900); }
  #mode.input #seg-manual { color: #fff; }
  #mode.off { opacity: 0.45; }
  #mode.off button { cursor: default; }

  /* Scene : l'ecran distant dans un cadre — bandeau (url, resolution,
     cadence, capture, plein ecran), repères de visee aux coins, liseret
     terracotta quand William a le controle. */
  #stage { display: flex; justify-content: center; align-items: flex-start; height: 100%;
    padding: calc(var(--bar) + 24px) 24px 24px; }
  #lens { position: relative; display: inline-block; max-width: 100%; }
  #frame { display: flex; flex-direction: column; border-radius: 16px; overflow: hidden;
    background: rgba(26, 23, 20, 0.85); border: 1px solid rgba(255, 255, 255, 0.09);
    box-shadow: 0 30px 70px rgba(0, 0, 0, 0.55), 0 2px 10px rgba(0, 0, 0, 0.35);
    transition: border-color var(--dur) var(--ease-out), box-shadow var(--dur) var(--ease-out); }
  body.input #frame { border-color: var(--terra-500); box-shadow: 0 30px 70px rgba(0, 0, 0, 0.55), 0 0 0 1px var(--terra-500), var(--shadow-terra-sm); }
  #chrome { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; height: 36px; padding: 0 8px 0 12px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.07); font: 500 11px/1 var(--font-mono); color: var(--warm-400); }
  /* Onglets Chrome en chips, defilables ; l'onglet principal (celui qu'on
     regarde) porte la pupille terracotta. Affichage seulement pour l'instant. */
  #tabs { display: flex; align-items: center; gap: 6px; min-width: 0; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  #tabs::-webkit-scrollbar { display: none; }
  .tab { display: inline-flex; align-items: center; gap: 7px; flex: 0 0 auto; max-width: 220px; height: 24px; padding: 0 10px;
    border-radius: var(--r-pill); border: 1px solid rgba(255, 255, 255, 0.08); background: rgba(255, 255, 255, 0.03);
    color: var(--warm-400); letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: border-color var(--dur) var(--ease-out), color var(--dur) var(--ease-out), background var(--dur) var(--ease-out); }
  .tab .pupil { width: 6px; height: 6px; border-radius: 50%; background: var(--warm-600); flex: 0 0 auto; }
  .tab.primary { color: var(--warm-25); border-color: rgba(218, 119, 86, 0.55); background: rgba(218, 119, 86, 0.10); }
  .tab.primary .pupil { background: var(--terra-500); box-shadow: 0 0 6px rgba(218, 119, 86, 0.6); }
  .tab span { overflow: hidden; text-overflow: ellipsis; }
  #meta { display: flex; align-items: center; gap: 4px; }
  #meta .stat { padding: 0 8px; letter-spacing: 0.08em; white-space: nowrap; }
  #meta .stat b { font-weight: 600; color: var(--warm-200); }
  #meta .sep { width: 1px; height: 14px; background: rgba(255, 255, 255, 0.1); }
  .icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 8px;
    border: 0; background: transparent; color: var(--warm-400); cursor: pointer; touch-action: manipulation;
    transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-spring); }
  .icon-btn:hover { background: rgba(255, 255, 255, 0.07); color: var(--warm-25); }
  .icon-btn:active { transform: scale(0.92); }
  .icon-btn:focus-visible { outline: none; box-shadow: var(--ring-focus-inverse); }
  .icon-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #screen { display: block; max-width: calc(100vw - 48px); max-height: calc(100vh - var(--bar) - 48px - 36px); width: auto; height: auto;
    background: var(--warm-900); touch-action: none; -webkit-user-select: none; user-select: none;
    transition: opacity var(--dur) var(--ease-out); }
  #tv { display: none; position: absolute; inset: 0; width: 100%; height: 100%; background: var(--warm-900); border-radius: 0; }
  body.video #tv { display: block; }
  body.video #screen { visibility: hidden; } /* keeps the layout box; the video paints over it */
  #vbtn.on { color: var(--terra-400); }
  body.input #screen, body.input #tv { cursor: crosshair; }
  body.off #screen { opacity: 0.5; }
  /* Repères de visee : quatre coins, hors du cadre. */
  .tick { position: absolute; width: 14px; height: 14px; pointer-events: none; opacity: 0.35;
    border-color: var(--warm-25); border-style: solid; border-width: 0;
    transition: border-color var(--dur) var(--ease-out), opacity var(--dur) var(--ease-out); }
  .tick.tl { top: -11px; left: -11px; border-top-width: 1.5px; border-left-width: 1.5px; border-top-left-radius: 4px; }
  .tick.tr { top: -11px; right: -11px; border-top-width: 1.5px; border-right-width: 1.5px; border-top-right-radius: 4px; }
  .tick.bl { bottom: -11px; left: -11px; border-bottom-width: 1.5px; border-left-width: 1.5px; border-bottom-left-radius: 4px; }
  .tick.br { bottom: -11px; right: -11px; border-bottom-width: 1.5px; border-right-width: 1.5px; border-bottom-right-radius: 4px; }
  body.input .tick { border-color: var(--terra-400); opacity: 0.9; }
  /* Curseur de Claude : un orbe terracotta qui glisse vers la cible, une
     onde au clic, s'efface apres quelques secondes sans action. */
  #shot { position: relative; }
  #cursor { position: absolute; left: 0; top: 0; width: 22px; height: 22px; margin: -11px 0 0 -11px; pointer-events: none; z-index: 3;
    opacity: 0; transform: translate(0, 0); transition: transform 320ms var(--ease-out), opacity var(--dur) var(--ease-out); }
  #cursor.show { opacity: 1; }
  #cursor .ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--terra-500);
    box-shadow: 0 0 0 1px rgba(14, 12, 10, 0.6), 0 0 12px rgba(218, 119, 86, 0.55); background: rgba(218, 119, 86, 0.14); }
  #cursor .core { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: var(--terra-500); }
  #cursor .ripple { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--terra-400); opacity: 0; }
  #cursor.click .ripple { animation: ripple 620ms var(--ease-out) forwards; }
  @keyframes ripple { 0% { transform: scale(0.6); opacity: 0.9; } 100% { transform: scale(3.2); opacity: 0; } }
  #cursor .tag { position: absolute; left: 18px; top: -4px; white-space: nowrap; font: 500 10px/1 var(--font-mono); letter-spacing: 0.06em;
    color: var(--warm-25); background: rgba(26, 23, 20, 0.9); border: 1px solid rgba(218, 119, 86, 0.5); border-radius: 6px; padding: 5px 7px;
    max-width: 260px; overflow: hidden; text-overflow: ellipsis; }

  /* Journal des actions : panneau repliable a droite, mono, discret. */
  #journal { position: fixed; top: 0; right: 0; bottom: 0; width: 300px; z-index: 4; display: flex; flex-direction: column;
    background: rgba(26, 23, 20, 0.94); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border-left: 1px solid var(--border-inverse); transform: translateX(100%); transition: transform var(--dur) var(--ease-out); }
  body.journal #journal { transform: none; }
  #journal header { display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 12px 0 16px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.07); font: 500 11px/1 var(--font-mono); letter-spacing: 0.2em; text-transform: uppercase; color: var(--warm-400); }
  #entries { flex: 1; overflow-y: auto; padding: 8px 0; margin: 0; list-style: none; scrollbar-width: thin; }
  #entries li { display: grid; grid-template-columns: 52px 1fr; gap: 10px; padding: 7px 16px; font: 400 12px/1.35 var(--font-mono); color: var(--warm-200);
    border-left: 2px solid transparent; animation: entry 360ms var(--ease-out); }
  #entries li time { color: var(--warm-500); font-size: 11px; }
  #entries li.click, #entries li.type, #entries li.press, #entries li.hover { border-left-color: var(--terra-500); }
  #entries li.navigate, #entries li.tab { border-left-color: var(--warm-400); }
  #entries li.pause { color: var(--amber-500); }
  #entries li.empty { color: var(--warm-500); font-style: italic; }
  @keyframes entry { from { opacity: 0; transform: translateX(6px); } to { opacity: 1; transform: none; } }
  #jbtn.on { color: var(--terra-400); }
  body.journal #stage { padding-right: 324px; }
  body.journal #screen { max-width: calc(100vw - 48px - 300px); }

  /* Pause : bouton rond dans le notch ; en pause, le notch vire a l'ambre. */
  #pause { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border-inverse); background: var(--warm-800); color: var(--warm-25);
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer; touch-action: manipulation;
    transition: background var(--dur) var(--ease-out), border-color var(--dur) var(--ease-out), transform var(--dur-fast) var(--ease-spring), opacity var(--dur) var(--ease-out); }
  #pause:hover { background: var(--warm-700); }
  #pause:active { transform: scale(0.94); }
  #pause:focus-visible { outline: none; box-shadow: var(--ring-focus-inverse); }
  #pause:disabled { opacity: 0.45; cursor: default; }
  #pause svg { width: 14px; height: 14px; fill: currentColor; }
  #pause .play { display: none; }
  body.paused #pause { background: var(--amber-500); border-color: var(--amber-500); color: #1A1714; }
  body.paused #pause .pause { display: none; }
  body.paused #pause .play { display: block; }
  body.paused #bar { border-color: rgba(197, 136, 42, 0.55); box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(197, 136, 42, 0.35); }

  /* Plein ecran : le cadre prend tout, sans chrome ni notch. */
  body.fs #bar, body.fs #hint, body.fs .tick, body.fs #journal { display: none; }
  body.fs #stage { padding: 0; }
  body.fs #frame { border-radius: 0; border: 0; box-shadow: none; }
  body.fs #chrome { display: none; }
  body.fs #screen { max-width: 100vw; max-height: 100vh; }
  #kb { position: absolute; opacity: 0; width: 1px; height: 1px; border: 0; padding: 0; }

  @media (max-width: 520px) {
    #bar { gap: 14px; padding: 8px 10px 10px 16px; border-radius: 0 0 20px 20px; }
    #wordmark { font-size: 17px; }
    #stage { padding: calc(var(--bar) + 22px) 12px 12px; }
    #hint { font-size: 10px; letter-spacing: 0.12em; padding: 0 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #pause { width: 36px; height: 36px; }
    #screen { max-width: calc(100vw - 24px); max-height: calc(100vh - var(--bar) - 30px - 36px); }
    #meta .stat.res { display: none; }
    #journal { width: 100%; }
    body.journal #stage { padding-right: 12px; }
    body.journal #screen { max-width: calc(100vw - 24px); }
    #cursor .tag { display: none; }
    .tick { display: none; }
    #mode { min-height: 36px; }
    #mode button { min-width: 64px; padding: 0 10px; font-size: 12px; }
  }
</style>
</head>
<body>
  <div id="bar">
    <div id="left">
      <svg id="mark" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <circle class="ring" cx="12" cy="12" r="9.25"/>
        <path class="sheen" d="M6.6 8.4a6.6 6.6 0 0 1 4.2-2.9"/>
        <circle id="dot" cx="12" cy="12" r="3.1"/>
      </svg>
    </div>
    <div id="wordmark">Scry</div>
    <div id="right">
      <button id="pause" type="button" title="Mettre Claude en pause" aria-label="Mettre Claude en pause" disabled>
        <svg class="pause" viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="1.5" width="3.6" height="11" rx="1"/><rect x="8.4" y="1.5" width="3.6" height="11" rx="1"/></svg>
        <svg class="play" viewBox="0 0 14 14" aria-hidden="true"><path d="M3.5 1.8v10.4L12 7z"/></svg>
      </button>
      <div id="mode" class="read off" role="radiogroup" aria-label="mode">
        <button id="seg-auto" type="button" role="radio" aria-checked="true" disabled>Auto</button>
        <button id="seg-manual" type="button" role="radio" aria-checked="false" disabled>Manuel</button>
      </div>
    </div>
    <input id="kb" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="capture clavier">
  </div>
  <div id="hint"></div>
  <div id="stage">
    <div id="lens">
      <span class="tick tl"></span><span class="tick tr"></span><span class="tick bl"></span><span class="tick br"></span>
      <div id="frame">
        <div id="chrome">
          <div id="tabs" aria-label="onglets"></div>
          <div id="meta">
            <span class="stat res"><b id="res">—</b></span>
            <span class="sep"></span>
            <span class="stat"><b id="fps">0</b> i/s</span>
            <span class="sep"></span>
            <button class="icon-btn" id="vbtn" type="button" title="Vidéo H.264 (GPU) / images JPEG" aria-label="Basculer vidéo ou images">
              <svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/></svg>
            </button>
            <span class="sep"></span>
            <button class="icon-btn" id="jbtn" type="button" title="Journal des actions" aria-label="Journal des actions">
              <svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h9"/></svg>
            </button>
            <button class="icon-btn" id="snap" type="button" title="Capturer l'image" aria-label="Capturer l'image">
              <svg viewBox="0 0 24 24"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6H8l1.4-2h5.2L16 6h1.5A2.5 2.5 0 0 1 20 8.5V17a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="12.5" r="3.2"/></svg>
            </button>
            <button class="icon-btn" id="fs" type="button" title="Plein écran" aria-label="Plein écran">
              <svg viewBox="0 0 24 24"><path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/></svg>
            </button>
          </div>
        </div>
        <div id="shot">
          <img id="screen" alt="vue live">
          <video id="tv" muted autoplay playsinline></video>
          <div id="cursor" aria-hidden="true"><span class="ripple"></span><span class="ring"></span><span class="core"></span><span class="tag"></span></div>
        </div>
      </div>
    </div>
  </div>
  <aside id="journal" aria-label="journal des actions">
    <header><span>Journal</span><button class="icon-btn" id="jclose" type="button" aria-label="Fermer"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
    <ul id="entries"><li class="empty"><time></time><span>aucune action encore</span></li></ul>
  </aside>
<script>
(function () {
  // Token from the fragment only (never the query string), then scrub it from
  // history immediately (n4). Never logged. It is ALSO kept in this tab's
  // sessionStorage: a plain reload (the reflex when a view looks stuck) would
  // otherwise come back with no token and lock a valid link out as
  // "lien expire". sessionStorage is per tab, dies with the tab, never
  // reaches history or any server log.
  var KEY = 'scry.token';
  var token = new URLSearchParams((location.hash || '').replace(/^#/, '')).get('token') || '';
  try {
    if (token) sessionStorage.setItem(KEY, token);
    else token = sessionStorage.getItem(KEY) || '';
  } catch (e) {}
  try { history.replaceState(null, document.title, location.pathname + location.search); } catch (e) {}

  var img = document.getElementById('screen');
  var modeEl = document.getElementById('mode');
  var dot = document.getElementById('dot');
  var hint = document.getElementById('hint');
  var kb = document.getElementById('kb');
  var segAuto = document.getElementById('seg-auto');
  var segManual = document.getElementById('seg-manual');
  var frameW = 0, frameH = 0, mode = 'read';

  // Physical pixels this device can show for the frame (stage size x DPR):
  // the server caps the screencast to exactly that, so a retina desktop
  // gets full-resolution frames and a phone gets a stream its size.
  var bar = document.getElementById('bar');
  function viewSize() {
    var dpr = window.devicePixelRatio || 1;
    var barH = bar.offsetHeight || 41;
    document.documentElement.style.setProperty('--bar', barH + 'px');
    var fs = document.body.classList.contains('fs');
    var side = (!fs && document.body.classList.contains('journal') && window.innerWidth > 520) ? 300 : 0;
    var w = Math.max(1, window.innerWidth - (fs ? 0 : 48) - side), h = Math.max(1, window.innerHeight - (fs ? 0 : barH + 48 + 36));
    return { w: Math.round(w * dpr), h: Math.round(h * dpr) };
  }
  var vs = viewSize();

  var scheme = location.protocol === 'https:' ? 'wss://' : 'ws://';
  var ws = null, retryTimer = 0, retryMs = 1000, gaveUp = false;

  // Video (H.264 fMP4 through Media Source Extensions) when the browser can
  // decode it and William hasn't switched it off; JPEG frames otherwise.
  var tv = document.getElementById('tv'), vbtn = document.getElementById('vbtn');
  var MIME = 'video/mp4; codecs="avc1.42E01E"';
  var MS = window.ManagedMediaSource || window.MediaSource;
  var canVideo = !!(MS && MS.isTypeSupported && MS.isTypeSupported(MIME));
  var wantVideo = canVideo && (function () { try { return sessionStorage.getItem('scry.video') !== 'off'; } catch (e) { return true; } })();
  var mediaSource = null, sb = null, appendQueue = [], videoUp = false, videoFailed = false;
  function setVideoUI(on) { document.body.classList.toggle('video', on); vbtn.classList.toggle('on', on); }
  vbtn.disabled = !canVideo;
  if (!canVideo) vbtn.title = 'Vidéo non supportée par ce navigateur';

  // The link drops for ordinary reasons — the phone locks, Safari goes to
  // the background, the tunnel hiccups, the MCP server restarts. The token
  // stays valid through all of that, so reconnect on our own with a short
  // backoff, keeping the last frame on screen. Only an invalid/expired token
  // (close 1008) is final: William needs a fresh link from live_start.
  function connect() {
    clearTimeout(retryTimer);
    if (gaveUp) return;
    if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
    var useVideo = wantVideo && !videoFailed;
    var s = new WebSocket(scheme + location.host + '/?token=' + encodeURIComponent(token) + '&w=' + vs.w + '&h=' + vs.h + (useVideo ? '&video=1' : ''));
    s.binaryType = 'arraybuffer';
    ws = s;
    resetVideo();
    s.onopen = function () { retryMs = 1000; dot.classList.add('on'); document.body.classList.remove('off'); setEnabled(true); setMode(mode); };
    s.onerror = function () { /* no payload logged */ };
    s.onclose = function (ev) {
      dot.classList.remove('on');
      document.body.classList.add('off');
      setEnabled(false);
      if (ev && ev.code === 1008) { gaveUp = true; try { sessionStorage.removeItem(KEY); } catch (e) {} hint.textContent = 'lien expiré — demande un nouveau lien à Claude'; return; }
      hint.textContent = 'reconnexion…';
      retryTimer = setTimeout(connect, retryMs);
      retryMs = Math.min(10000, retryMs * 2);
    };
    s.onmessage = function (ev) {
      if (typeof ev.data !== 'string') { onVideoChunk(new Uint8Array(ev.data)); return; }
      var msg; try { msg = JSON.parse(ev.data); } catch (e) { return; }
      if (!msg) return;
      if (msg.video) {
        if (msg.video.error) { videoFailed = true; setVideoUI(false); hint.textContent = 'vidéo indisponible — images JPEG'; try { s.close(); } catch (e) {} return; }
        if (msg.video.w) {
          frameW = msg.video.w; frameH = msg.video.h; resEl.textContent = frameW + ' × ' + frameH;
          // The <img> keeps the layout box: give it a blank canvas of the stream's size.
          var c = document.createElement('canvas'); c.width = frameW; c.height = frameH; img.src = c.toDataURL('image/png');
        }
        return;
      }
      if (typeof msg.mode === 'string' && msg.mode !== mode) setMode(msg.mode);
      if (Array.isArray(msg.tabs)) renderTabs(msg.tabs);
      if (msg.action) onAction(msg.action);
      if (typeof msg.paused === 'boolean') setPaused(msg.paused);
      if (typeof msg.data === 'string') {
        if (msg.w) frameW = msg.w;
        if (msg.h) frameH = msg.h;
        if (videoUp) return; // JPEG frames don't flow on the video path; ignore strays
        img.src = 'data:image/jpeg;base64,' + msg.data;
        blip();
        frames++;
        if (typeof msg.url === 'string' && msg.url !== lastUrl) { lastUrl = msg.url; }
        if (frameW && frameH) resEl.textContent = frameW + ' × ' + frameH;
      }
    };
  }
  connect();
  // Back to the foreground (screen unlock, app switch): don't wait for the
  // backoff, try right away.
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { retryMs = 1000; connect(); } });
  window.addEventListener('online', function () { retryMs = 1000; connect(); });

  // Rotation / window resize: ask for a new cap (debounced; server coalesces).
  var resizeTimer = 0;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      var s = viewSize();
      if (s.w !== vs.w || s.h !== vs.h) { vs = s; send({ t: 'view', w: s.w, h: s.h }); }
    }, 300);
  });

  // ---- MSE : un init segment (0x01) ouvre un nouveau MediaSource, chaque
  // fragment (0x02) est ajoute en sequence ; on colle au direct.
  function resetVideo() {
    appendQueue = []; sb = null; videoUp = false;
    if (mediaSource) { try { if (mediaSource.readyState === 'open') mediaSource.endOfStream(); } catch (e) {} }
    mediaSource = null;
    try { tv.removeAttribute('src'); tv.load(); } catch (e) {}
    setVideoUI(false);
  }
  function onVideoChunk(u8) {
    var kind = u8[0], body = u8.subarray(1);
    if (kind === 1) {
      resetVideo();
      var m = new MS(); mediaSource = m;
      m.addEventListener('sourceopen', function () {
        if (mediaSource !== m) return;
        try { sb = m.addSourceBuffer(MIME); } catch (e) { videoFailed = true; resetVideo(); try { ws.close(); } catch (x) {} return; }
        sb.mode = 'sequence';
        sb.addEventListener('updateend', pump);
        appendQueue.unshift(body);
        pump();
      });
      if (window.ManagedMediaSource && m instanceof window.ManagedMediaSource) { tv.disableRemotePlayback = true; tv.srcObject = m; }
      else tv.src = URL.createObjectURL(m);
      setVideoUI(true);
      tv.play().catch(function () {});
    } else if (kind === 2) {
      if (!sb) { if (mediaSource) appendQueue.push(body); return; }
      appendQueue.push(body); pump();
    }
  }
  function pump() {
    if (!sb || sb.updating || !appendQueue.length) return;
    try { sb.appendBuffer(appendQueue.shift()); videoUp = true; blip(); frames++; }
    catch (e) { /* QuotaExceeded: trim and retry next tick */ trimVideo(true); }
  }
  function trimVideo(force) {
    if (!sb || sb.updating || !tv.buffered.length) return;
    var start = tv.buffered.start(0), cut = tv.currentTime - 8;
    if (force || cut - start > 20) { try { sb.remove(start, Math.max(start + 0.1, cut)); } catch (e) {} }
  }
  // Rester au direct : si on traine de plus de 0.6 s derriere le bord, on saute.
  setInterval(function () {
    if (!videoUp || !tv.buffered.length) return;
    var end = tv.buffered.end(tv.buffered.length - 1);
    if (end - tv.currentTime > 0.6) tv.currentTime = Math.max(0, end - 0.12);
    if (tv.paused) tv.play().catch(function () {});
    trimVideo(false);
  }, 1000);
  vbtn.addEventListener('click', function () {
    wantVideo = !wantVideo; videoFailed = false;
    try { sessionStorage.setItem('scry.video', wantVideo ? 'on' : 'off'); } catch (e) {}
    try { ws.close(); } catch (e) {} // reconnect with the other path
    retryMs = 300;
  });

  // Bandeau : onglets, resolution, cadence (images recues par seconde).
  var tabsEl = document.getElementById('tabs'), resEl = document.getElementById('res'), fpsEl = document.getElementById('fps');
  var frames = 0, lastUrl = '', lastTabsJson = '';
  function prettyUrl(u) { try { var x = new URL(u); return x.host + (x.pathname === '/' ? '' : x.pathname); } catch (e) { return u || '—'; } }
  function renderTabs(tabs) {
    var json = JSON.stringify(tabs);
    if (json === lastTabsJson) return;
    lastTabsJson = json;
    tabsEl.textContent = '';
    tabs.forEach(function (t) {
      var chip = document.createElement('div');
      chip.className = 'tab' + (t.primary ? ' primary' : '');
      chip.title = (t.title ? t.title + ' — ' : '') + t.url;
      var pupil = document.createElement('i'); pupil.className = 'pupil';
      var label = document.createElement('span'); label.textContent = prettyUrl(t.url);
      chip.appendChild(pupil); chip.appendChild(label);
      tabsEl.appendChild(chip);
    });
  }
  setInterval(function () { fpsEl.textContent = String(frames); frames = 0; }, 1000);

  // Capturer : telecharge l'image affichee (cote client, rien ne transite).
  document.getElementById('snap').addEventListener('click', function () {
    var src = '';
    if (videoUp && tv.videoWidth) {
      var c = document.createElement('canvas'); c.width = tv.videoWidth; c.height = tv.videoHeight;
      c.getContext('2d').drawImage(tv, 0, 0); src = c.toDataURL('image/jpeg', 0.92);
    } else if (img.src && img.src.indexOf('data:image/jpeg') === 0) src = img.src;
    if (!src) return;
    var a = document.createElement('a');
    a.href = src; a.download = 'scry-' + new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19) + '.jpg';
    document.body.appendChild(a); a.click(); a.remove();
  });
  // Plein ecran : le cadre seul, sans notch ; le flux est redemande a la
  // nouvelle taille via le resize qui suit.
  var fsBtn = document.getElementById('fs');
  function setFs(on) { document.body.classList.toggle('fs', on); window.dispatchEvent(new Event('resize')); }
  fsBtn.addEventListener('click', function () {
    var el = document.documentElement;
    if (!document.fullscreenElement && el.requestFullscreen) { el.requestFullscreen().catch(function () { setFs(true); }); }
    else if (document.fullscreenElement && document.exitFullscreen) { document.exitFullscreen(); }
    else { setFs(!document.body.classList.contains('fs')); }
  });
  document.addEventListener('fullscreenchange', function () { setFs(!!document.fullscreenElement); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && document.body.classList.contains('fs') && !document.fullscreenElement) setFs(false); });

  // Curseur de Claude + journal. Les coordonnees arrivent en px CSS de la
  // page distante ; on les projette sur l'image affichee.
  var cursor = document.getElementById('cursor'), cursorTag = cursor.querySelector('.tag'), entries = document.getElementById('entries');
  var cursorTimer = 0, journalOpen = false;
  function toView(x, y) { var r = img.getBoundingClientRect(); if (!r.width || !frameW || !frameH) return null; return { x: x / frameW * r.width, y: y / frameH * r.height }; }
  function onAction(a) {
    var label = String(a.label || a.kind || '');
    if (typeof a.x === 'number' && typeof a.y === 'number') {
      var v = toView(a.x, a.y);
      if (v) {
        cursor.style.transform = 'translate(' + v.x.toFixed(1) + 'px,' + v.y.toFixed(1) + 'px)';
        cursorTag.textContent = label;
        cursor.classList.add('show');
        cursor.classList.remove('click'); void cursor.offsetWidth;
        if (a.kind === 'click' || a.kind === 'press' || a.kind === 'type') cursor.classList.add('click');
        clearTimeout(cursorTimer);
        cursorTimer = setTimeout(function () { cursor.classList.remove('show'); }, 4500);
      }
    }
    addEntry(a.kind || 'action', label, a.at);
    hint.textContent = label.slice(0, 60);
    clearTimeout(onAction.hintTimer);
    onAction.hintTimer = setTimeout(function () { if (hint.textContent === label.slice(0, 60)) hint.textContent = ''; }, 3000);
  }
  function addEntry(kind, label, at) {
    var empty = entries.querySelector('.empty'); if (empty) empty.remove();
    var li = document.createElement('li'); li.className = kind;
    var t = document.createElement('time'); var d = at ? new Date(at) : new Date();
    t.textContent = d.toTimeString().slice(0, 8);
    var sp = document.createElement('span'); sp.textContent = label;
    li.appendChild(t); li.appendChild(sp); entries.appendChild(li);
    while (entries.children.length > 300) entries.removeChild(entries.firstChild);
    entries.scrollTop = entries.scrollHeight;
  }
  var jbtn = document.getElementById('jbtn');
  function setJournal(on) { journalOpen = on; document.body.classList.toggle('journal', on); jbtn.classList.toggle('on', on); window.dispatchEvent(new Event('resize')); }
  jbtn.addEventListener('click', function () { setJournal(!journalOpen); });
  document.getElementById('jclose').addEventListener('click', function () { setJournal(false); });

  // Pause : fige les actions de Claude sans prendre le controle.
  var pauseBtn = document.getElementById('pause'), paused = false;
  function setPaused(on) {
    if (on === paused) return;
    paused = on;
    document.body.classList.toggle('paused', on);
    pauseBtn.title = on ? 'Reprendre' : 'Mettre Claude en pause';
    addEntry('pause', on ? 'pause — Claude attend' : 'reprise');
  }
  pauseBtn.addEventListener('click', function () { send({ t: 'pause', on: !paused }); });

  // The dot beats once per received frame (rate-limited so a 30 fps burst
  // reads as a lively flutter, not a strobe).
  var blipUntil = 0, blipTimer = 0;
  function blip() {
    var now = Date.now();
    if (now < blipUntil) return;
    blipUntil = now + 220;
    dot.classList.add('blip');
    clearTimeout(blipTimer);
    blipTimer = setTimeout(function () { dot.classList.remove('blip'); }, 140);
  }

  function setMode(m) {
    mode = m;
    modeEl.classList.toggle('input', m === 'input');
    modeEl.classList.toggle('read', m !== 'input');
    segAuto.setAttribute('aria-checked', m !== 'input' ? 'true' : 'false');
    segManual.setAttribute('aria-checked', m === 'input' ? 'true' : 'false');
    document.body.classList.toggle('input', m === 'input');
    hint.textContent = '';
  }
  setMode('read');

  // Auto / Manuel from the page itself (the same switch as the live_mode
  // tool). Enabled only while connected; the server confirms the new mode
  // with a {mode} push, which is what actually moves the toggle.
  function setEnabled(on) { segAuto.disabled = !on; segManual.disabled = !on; pauseBtn.disabled = !on; modeEl.classList.toggle('off', !on); }
  segAuto.addEventListener('click', function () { if (mode !== 'read') send({ t: 'mode', mode: 'read' }); });
  segManual.addEventListener('click', function () { if (mode !== 'input') { send({ t: 'mode', mode: 'input' }); try { kb.focus(); } catch (x) {} } });

  function send(obj) { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj)); }

  // Map a client point over the <img> to the page CSS-pixel space CDP uses.
  function toPage(cx, cy) {
    var r = img.getBoundingClientRect();
    if (!r.width || !r.height || !frameW || !frameH) return null;
    return { x: Math.round((cx - r.left) / r.width * frameW), y: Math.round((cy - r.top) / r.height * frameH) };
  }
  function mods(e) { return (e.altKey ? 1 : 0) | (e.ctrlKey ? 2 : 0) | (e.metaKey ? 4 : 0) | (e.shiftKey ? 8 : 0); }

  // Pointer events unify mouse + touch + pen. Relayed only in input mode.
  // Mouse: press / move / release as-is (a drag stays a drag), wheel relayed.
  // Touch: one finger = tap (press+release on lift) or, once it moves, a
  // scroll relayed as wheel deltas; two fingers = pinch, relayed on lift as
  // one synthesized pinch gesture centred between the fingers.
  var TAP_SLOP = 8;
  var pointers = {};        // pointerId -> { sx, sy, x, y, page }
  var touchCount = 0, gesture = null, pinchStart = 0, pinchScale = 1, pinchCenter = null;
  function scaleFactor() { var r = img.getBoundingClientRect(); return (r.width && frameW) ? frameW / r.width : 1; }
  function mouse(type, x, y, e, extra) {
    if (mode !== 'input') return;
    var p = toPage(x, y);
    if (!p) return;
    var m = { t: 'mouse', type: type, x: p.x, y: p.y, button: 'left', clickCount: 1, modifiers: mods(e) };
    if (extra) for (var k in extra) m[k] = extra[k];
    send(m);
  }
  function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
  function twoPointers() { var ids = Object.keys(pointers); return ids.length === 2 ? [pointers[ids[0]], pointers[ids[1]]] : null; }

  var shot = document.getElementById('shot');
  shot.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    if (mode !== 'input') return;
    if (e.pointerType === 'mouse') { mouse('mousePressed', e.clientX, e.clientY, e); return; }
    try { shot.setPointerCapture(e.pointerId); } catch (x) {}
    pointers[e.pointerId] = { sx: e.clientX, sy: e.clientY, x: e.clientX, y: e.clientY };
    touchCount = Object.keys(pointers).length;
    if (touchCount === 1) { gesture = 'tap'; }
    else if (touchCount === 2) {
      var pr = twoPointers(); gesture = 'pinch'; pinchStart = dist(pr[0], pr[1]); pinchScale = 1;
      pinchCenter = { x: (pr[0].x + pr[1].x) / 2, y: (pr[0].y + pr[1].y) / 2 };
    }
  });
  shot.addEventListener('pointermove', function (e) {
    if (mode !== 'input') return;
    e.preventDefault();
    if (e.pointerType === 'mouse') { mouse('mouseMoved', e.clientX, e.clientY, e); return; }
    var pt = pointers[e.pointerId]; if (!pt) return;
    var dx = e.clientX - pt.x, dy = e.clientY - pt.y;
    pt.x = e.clientX; pt.y = e.clientY;
    if (gesture === 'tap' && Math.hypot(e.clientX - pt.sx, e.clientY - pt.sy) > TAP_SLOP) gesture = 'scroll';
    if (gesture === 'scroll') {
      var k = scaleFactor();
      mouse('mouseWheel', e.clientX, e.clientY, e, { deltaX: -dx * k, deltaY: -dy * k });
    } else if (gesture === 'pinch') {
      var pr = twoPointers(); if (pr && pinchStart > 0) pinchScale = dist(pr[0], pr[1]) / pinchStart;
    }
  });
  function endPointer(e) {
    if (e.pointerType === 'mouse') { if (mode === 'input') { mouse('mouseReleased', e.clientX, e.clientY, e); try { kb.focus(); } catch (x) {} } return; }
    var pt = pointers[e.pointerId]; delete pointers[e.pointerId];
    var remaining = Object.keys(pointers).length;
    if (mode !== 'input' || !pt) { gesture = remaining ? gesture : null; return; }
    if (gesture === 'tap' && remaining === 0) {
      mouse('mousePressed', e.clientX, e.clientY, e); mouse('mouseReleased', e.clientX, e.clientY, e);
      try { kb.focus(); } catch (x) {}
    } else if (gesture === 'pinch' && remaining === 0 && pinchCenter && Math.abs(pinchScale - 1) > 0.05) {
      var p = toPage(pinchCenter.x, pinchCenter.y);
      if (p) send({ t: 'pinch', x: p.x, y: p.y, scaleFactor: pinchScale });
    }
    if (remaining === 0) { gesture = null; pinchCenter = null; }
  }
  shot.addEventListener('pointerup', function (e) { e.preventDefault(); endPointer(e); });
  shot.addEventListener('pointercancel', function (e) { endPointer(e); });
  // Desktop: the wheel goes through as a wheel (ctrl+wheel = Chrome zoom).
  shot.addEventListener('wheel', function (e) {
    if (mode !== 'input') return;
    e.preventDefault();
    var k = e.deltaMode === 1 ? 16 : 1;
    mouse('mouseWheel', e.clientX, e.clientY, e, { deltaX: e.deltaX * k, deltaY: e.deltaY * k });
  }, { passive: false });

  // Keyboard, captured at window level (covers a physical keyboard and the
  // hidden #kb input that only exists to raise the mobile soft keyboard).
  // A printable key carries its char as text on keyDown — that is what
  // inserts it (the same shape Puppeteer uses); modifiers with ctrl/meta are
  // treated as shortcuts (no text). keyUp mirrors it. Nothing is buffered.
  window.addEventListener('keydown', function (e) {
    if (mode !== 'input') return;
    // A printable key carries its char as text; Enter carries a carriage
    // return so the keyDown actually submits the login form (without text,
    // CDP's Enter does nothing). Shortcuts (ctrl/meta) carry no text.
    var text = (e.key && e.key.length === 1 && !e.ctrlKey && !e.metaKey) ? e.key
             : (e.key === 'Enter' && !e.ctrlKey && !e.metaKey) ? '\r'
             : undefined;
    send({ t: 'key', type: 'keyDown', key: e.key, code: e.code, windowsVirtualKeyCode: e.keyCode, text: text, modifiers: mods(e) });
    if (e.key !== 'F5') e.preventDefault();
  });
  window.addEventListener('keyup', function (e) {
    if (mode !== 'input') return;
    send({ t: 'key', type: 'keyUp', key: e.key, code: e.code, windowsVirtualKeyCode: e.keyCode, modifiers: mods(e) });
    e.preventDefault();
  });
})();
</script>
</body>
</html>
